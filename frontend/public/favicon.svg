<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#060d1f"/>
    </radialGradient>
    <linearGradient id="kk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado azul oscuro (igual que el KanbanaLogo de la app) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Órbitas -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="4 4"/>
  <ellipse cx="32" cy="32" rx="26" ry="12" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.2" transform="rotate(35 32 32)"/>
  <ellipse cx="32" cy="32" rx="26" ry="12" fill="none" stroke="#60a5fa" stroke-opacity="0.30" stroke-width="1.2" transform="rotate(-35 32 32)"/>

  <!-- Planetas -->
  <circle cx="57" cy="32" r="2.6" fill="#93c5fd"/>
  <circle cx="14" cy="20" r="2"   fill="#47bfff"/>
  <circle cx="50" cy="49" r="1.8" fill="#a5b4fc"/>

  <!-- La "K" -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800"
        fill="url(#kk)">K</text>
</svg>
